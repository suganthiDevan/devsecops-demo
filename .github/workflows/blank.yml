name: DevSecOps Automated Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security_audit:
    name: Multi-Layer Security Scanning Suite
    runs-on: ubuntu-latest

    steps:
    # 1. Download the code into the cloud workspace
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. SECRET SCANNING LAYER (Checks for leaked passwords)
    - name: Execute Secret Scan Detection
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: false

    # 3. STATIC APPLICATION SECURITY TESTING (SAST)
    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install SAST Scanner (Bandit)
      run: |
        python -m pip install --upgrade pip
        pip install bandit

    - name: Execute SAST Analysis
      run: |
        bandit -r . -ll -ii

    # 4. SOFTWARE COMPOSITION ANALYSIS (SCA)
    - name: Execute SCA Dependency Scan (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '1'
        severity: 'HIGH,CRITICAL'
