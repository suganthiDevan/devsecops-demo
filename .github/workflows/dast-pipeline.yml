name: DevSecOps Automated DAST Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  dast_scan:
    name: Automated DAST Scanning Suite
    runs-on: ubuntu-latest

    steps:
    # 1. Download the code into the cloud workspace container
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Spin up the target web application dynamically for scanning
    - name: Launch Target Web Application
      run: |
        python3 -m http.server 8000 &
        sleep 3

    # 3. OWASP ZAP DAST Baseline Scan Integration
    - name: Execute OWASP ZAP DAST Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        target: 'http://localhost:8000'
        fail_action: false # Prevents crashing on minor warnings, allowing report generation to finish cleanly
