name: DevSecOps Automated DAST Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  dast_scan:
    name: Automated DAST Scanning Suite
    runs-on: ubuntu-latest
    
    # Explicit Token Privileges configuration
    permissions:
      contents: write    
      issues: write      
      actions: read      

    steps:
    # 1. Download the code into the cloud workspace container
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Spin up the target web application dynamically for scanning
    - name: Launch Target Web Application
      run: |
        python3 -m http.server 8000 &
        sleep 3

    # 3. OWASP ZAP DAST Baseline Scan Integration (UPDATED TO V0.13.0)
    - name: Execute OWASP ZAP DAST Scan
      uses: zaproxy/action-baseline@v0.13.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        target: 'http://localhost:8000'
        fail_action: false 
